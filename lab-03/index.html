<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Относительное и абсолютное позиционирование</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1 class="visually-hidden">Космическая композиция</h1>
      <div
        class="canvas-scroll"
        tabindex="0"
        aria-label="Композиция размером 600 на 400 пикселей"
      >
        <div class="composition">
          <img
            class="planet planet-one"
            src="img/planet-1.png"
            alt="Бирюзовая планета"
          />
          <img
            class="planet planet-two"
            src="img/planet-2.png"
            alt="Синяя планета"
          />
          <img class="spaceship" src="img/spaceship.png" alt="Ракета" />
          <img
            class="planet planet-three"
            src="img/planet-3.png"
            alt="Большая жёлтая планета"
          />
          <img class="ufo" src="img/ufo.png" alt="Летающая тарелка" />
          <img class="asteroid" src="img/asteroid.png" alt="Астероид" />
          <img class="superman" src="img/superman.png" alt="Супергерой" />
        </div>
      </div>
    </main>
  </body>
</html>
