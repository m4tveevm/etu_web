<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Форма обратной связи</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main>
        <h1 class="visually-hidden">Contact form</h1>
        <form id="contact-form" lang="en">
            <fieldset>
                <legend>Full name</legend>
                <div class="row two">
                    <label><span class="visually-hidden">First name</span>
                        <input name="firstName" autocomplete="given-name" placeholder="First Name">
                    </label>
                    <label><span class="visually-hidden">Last name</span>
                        <input name="lastName" autocomplete="family-name" placeholder="Last Name">
                    </label>
                </div>
            </fieldset>
            <fieldset>
                <legend>Address</legend>
                <label><span class="visually-hidden">Street address</span>
                    <input name="street" autocomplete="street-address" placeholder="Street Address">
                </label>
                <div class="row three address-row">
                    <label><span class="visually-hidden">City</span>
                        <input name="city" autocomplete="address-level2" placeholder="City">
                    </label>
                    <label><span class="visually-hidden">State</span>
                        <input name="state" autocomplete="address-level1" placeholder="State">
                    </label>
                    <label><span class="visually-hidden">ZIP code</span>
                        <input name="zip" autocomplete="postal-code" placeholder="ZIP Code">
                    </label>
                </div>
            </fieldset>
            <fieldset>
                <legend>Contact Information</legend>
                <div class="row two">
                    <label><span class="visually-hidden">Email (required)</span>
                        <input type="email" name="email" autocomplete="email" placeholder="Email*" required>
                    </label>
                    <label><span class="visually-hidden">Phone</span>
                        <input type="tel" name="phone" autocomplete="tel" placeholder="Phone">
                    </label>
                </div>
            </fieldset>
            <fieldset>
                <legend>Questions / Comments</legend>
                <label><span class="visually-hidden">Message (required)</span>
                    <textarea name="message" placeholder="Message*" rows="3" required></textarea>
                </label>
            </fieldset>
            <label class="consent">
                <input type="checkbox" name="updates" value="yes">
                <span>Update me on deals and special offers via email.</span>
            </label>
            <button type="submit">Submit</button>
            <p class="form-note">Demo form. No data is sent.</p>
            <p id="form-status" role="status" hidden></p>
        </form>
    </main>
</body>
</html>
