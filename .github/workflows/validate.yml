name: Validate labs and services
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate GitHub Actions workflows
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" .github/workflows/*.yml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.3'
      - name: Rebuild committed styles
        shell: bash
        run: |
          set -euo pipefail
          for lab in lab-*/; do
            npm ci --ignore-scripts --prefix "$lab"
            npm run build:css --prefix "$lab"
          done
          lab-01/node_modules/.bin/sass --style=compressed --no-source-map site/catalogue.scss:site/catalogue.css
          lab-01/node_modules/.bin/sass --style=compressed --no-source-map site/viewer.scss:site/viewer.css
          git diff --exit-code -- '*.css'
      - name: Test services and release integrity
        run: |
          npm ci --ignore-scripts --prefix services/gate
          npm test --prefix services/gate
          npm test --prefix services/quotes
          python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build exact commit artifact
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          python3 scripts/build.py --release-id "$RELEASE_SHA" --output dist/site
          python3 scripts/upload.py --directory dist/site
          python3 services/quotes/package.py
          python3 services/gate/package.py
          cp services/quotes/dist/quotes.zip dist/quotes.zip
          cp services/gate/dist/gate.zip dist/gate.zip
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-${{ github.sha }}
          path: dist/
          retention-days: 30
          if-no-files-found: error
  terraform:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
        with:
          tofu_version: '1.13.0'
          tofu_wrapper: false
      - run: |
          tofu fmt -check -recursive infra
          tofu -chdir=infra/foundation init -backend=false -input=false -lockfile=readonly
          tofu -chdir=infra/foundation validate
          tofu -chdir=infra/foundation test
          tofu -chdir=infra/runtime init -backend=false -input=false -lockfile=readonly
          tofu -chdir=infra/runtime validate
