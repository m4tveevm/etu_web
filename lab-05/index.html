<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Каркас веб-сайта</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1 class="visually-hidden">Каркас веб-сайта</h1>
    <div class="top-bar" aria-label="Верхняя полоса"></div>
    <div class="header-band">
      <header class="page-header layout">
        <div class="brand" aria-label="Место для логотипа"></div>
        <nav class="navigation" aria-label="Место для основной навигации"></nav>
      </header>
    </div>
    <main>
      <section class="hero layout" aria-label="Главный баннер"></section>
      <div class="content layout">
        <aside class="sidebar" aria-label="Боковая колонка"></aside>
        <section class="article" aria-label="Основное содержимое"></section>
      </div>
    </main>
    <footer>
      <div class="footer-band">
        <div class="footer-grid layout">
          <section class="newsletter" aria-label="Блок подписки"></section>
          <section class="about" aria-label="О компании"></section>
          <section class="social" aria-label="Социальные сети"></section>
          <section class="address" aria-label="Контакты"></section>
        </div>
      </div>
      <div class="bottom-bar" aria-label="Нижняя полоса"></div>
    </footer>
  </body>
</html>
